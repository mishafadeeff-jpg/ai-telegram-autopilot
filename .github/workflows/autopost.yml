name: AI Telegram Channel Autopilot 24/7

on:
  schedule:
    # Запуск каждые 4 часа круглосуточно (в 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Возможность запустить вручную одной кнопкой

jobs:
  autopost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Autopilot Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_NAME: "⚡ AI Pulse Daily"
          CHANNEL_LINK: "https://t.me/aipulse_daily_global"
          MAX_POSTS_PER_RUN: 1
        run: |
          python main.py --once

      - name: Commit and push database state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add autopilot.db || true
          git commit -m "Update posted history [skip ci]" || echo "No changes to commit"
          git push || true
